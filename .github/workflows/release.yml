name: CI and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build bundled Python environment
        run: |
          python -m venv .eduplay-python
          .eduplay-python/bin/python -m pip install --upgrade pip
          .eduplay-python/bin/python -m pip install -r requirements.txt
        shell: bash

      - name: Syntax-check JavaScript sources
        run: |
          node --check main.js
          node --check renderer.js
          node --check server.js
          node --check copyFFmpeg.js
          node --check menu-template.js
          node --check mediaControl.js
          node --check subtitles.js

      - name: Syntax-check Python caption generator
        run: python -m py_compile generate_caption.py

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            artifact_dir: dist/linux
          - name: Windows
            os: windows-latest
            script: dist:win
            artifact_dir: dist/win
          - name: macOS
            os: macos-latest
            script: dist:mac
            artifact_dir: dist/mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build bundled Python environment
        run: |
          python -m venv .eduplay-python
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build package
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_dir }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux
          path: release-assets/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS
          path: release-assets/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linux/*.AppImage
            release-assets/linux/latest-linux.yml
            release-assets/linux/*.blockmap
            release-assets/windows/*.exe
            release-assets/windows/latest.yml
            release-assets/windows/*.blockmap
            release-assets/macos/*.dmg
            release-assets/macos/latest-mac.yml
            release-assets/macos/*.blockmap